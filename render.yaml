services:
  - type: web
    name: matjib
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: KFM_PUBLIC_MODE
        value: "1"
      - key: KFM_APP_DATA_DIR
        value: "/tmp/korea_food_map"
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: TOUR_API_SERVICE_KEY
        sync: false
